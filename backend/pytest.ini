[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 2026-10-25: xfail 不再允许"意外通过"（XPASS→FAIL）。
# 背景: 质量评审指出 48 个 xfail 无 strict 约束会静默腐烂 —— 底层修好了、
# 测试还挂着"预期失败"的牌子，没人再回头看。开启后 XPASS 即红，
# 逼着每处 xfail 保持"确实还在失败"或摘牌。
xfail_strict = true
filterwarnings =
    ignore::DeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20