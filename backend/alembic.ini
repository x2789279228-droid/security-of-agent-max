# ============================================
# Alembic migration config (2026-10-23)
#
# NOTE: keep this file ASCII-only - configparser on Windows reads it
# with the locale default encoding (GBK on zh-CN) and Chinese comments
# would crash `alembic upgrade`. Chinese docs live in migrations/README.md.
#
# sqlalchemy.url is NOT set here - migrations/env.py injects it from
# config.settings; tests may override with `-x db_url=sqlite:///...`.
# App startup auto-migration: SHARED_MEMORY_AUTO_MIGRATE=true (app.py).
#
# Common commands (run inside backend/):
#   alembic upgrade head
#   alembic revision -m "msg"
#   alembic revision --autogenerate -m "msg"
#   alembic stamp head
#   alembic current / history
# ============================================
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month)02d%%(day)02d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
