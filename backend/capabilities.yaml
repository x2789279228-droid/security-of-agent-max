    last_verified: "2026-10-26"
    demo: "合成标定面 P=1.0 R=1.0（ABLATION L3）；真实流量首触实体 inconclusive 属设计语义（q6_3）"
    notes: |
      两个面分开标注（PERF-2026-10-26 压测后）：
      · 合成标定面 verified —— L3 P=1.0/R=1.0，阈值可行区间 [0.3982, 0.6435) 非空且 0.60 在内；
        5 证据维度（含 severity_shift 基线相对偏移）+ 2 上下文，权重和恒 1.0。
      · 真实流量面 experimental —— 压测 15 分钟短窗全首触实体 → 100% inconclusive，
        这是 q6_3 纪律（新实体不判、不假装能判）下的设计语义，不是缺陷；
        改变它需要待决项 41 的冷启动规则（新实体+high/critical+罕见→升级），
        需独立 FP 评估拍板（PERF-OPT-PLAN Wave 0-2 上报）。
      2026-10-26 已落地：聚合降级（src 实体证据可用时按证据判定，其余维度逐维披露，
      error_code=partial_evidence_disclosure）；标定集钉钟修复（锚点+13h，评测不随挂钟漂移）。

