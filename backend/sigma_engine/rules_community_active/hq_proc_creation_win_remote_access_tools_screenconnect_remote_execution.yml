title: Remote Access Tool - ScreenConnect Remote Command Execution
id: b1f73849-6329-4069-bc8f-78a604bb8b23
status: test
description: Detects the execution of a system command via the ScreenConnect RMM service.
references:
- https://github.com/SigmaHQ/sigma/pull/4467
author: Ali Alwashali
date: 2023-10-10
modified: 2024-02-26
tags:
- attack.execution
- attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: \ScreenConnect.ClientService.exe
  selection_img:
  - Image|endswith: \cmd.exe
  - OriginalFileName: Cmd.Exe
  selection_cli:
    CommandLine|contains: \TEMP\ScreenConnect\
  condition: all of selection_*
falsepositives:
- Legitimate use of ScreenConnect. Disable this rule if ScreenConnect is heavily used.
level: low
x-soc-id: C-1274
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: low
x-soc-attack_type: malware
x-soc-severity: low
x-soc-source: SigmaHQ
x-soc-sigmahq-id: b1f73849-6329-4069-bc8f-78a604bb8b23
x-soc-version: 1
