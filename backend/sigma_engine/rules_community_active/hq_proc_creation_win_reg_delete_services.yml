title: Service Registry Key Deleted Via Reg.EXE
id: 05b2aa93-1210-42c8-8d9a-2fcc13b284f5
status: test
description: Detects execution of "reg.exe" commands with the "delete" flag on services registry key.
  Often used by attacker to remove AV software services
references:
- https://www.virustotal.com/gui/file/2bcd5702a7565952c44075ac6fb946c7780526640d1264f692c7664c02c68465
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-01
modified: 2023-02-04
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: reg.exe
  - OriginalFileName: reg.exe
  selection_delete:
    CommandLine|contains: ' delete '
  selection_key:
    CommandLine|contains: \SYSTEM\CurrentControlSet\services\
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
x-soc-id: C-1209
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: network_anomaly
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 05b2aa93-1210-42c8-8d9a-2fcc13b284f5
x-soc-version: 1
