title: Stop Windows Service Via Net.EXE
id: 88872991-7445-4a22-90b2-a3adadb0e827
related:
- id: eb87818d-db5d-49cc-a987-d5da331fbd90
  type: obsolete
status: test
description: Detects the stopping of a Windows service via the "net" utility.
references:
- https://ss64.com/nt/net-service.html
author: Jakob Weinzettl, oscd.community, Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-05
tags:
- attack.impact
- attack.t1489
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName:
    - net.exe
    - net1.exe
  - Image|endswith:
    - \net.exe
    - \net1.exe
  selection_cli:
    CommandLine|contains: ' stop '
  condition: all of selection_*
falsepositives:
- There are many legitimate reasons to stop a service. This rule isn't looking for any suspicious behaviour
  in particular. Filter legitimate activity accordingly
level: low
x-soc-id: C-992
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: low
x-soc-attack_type: malware
x-soc-severity: low
