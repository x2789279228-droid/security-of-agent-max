title: MMC Executing Files with Reversed Extensions Using RTLO Abuse
id: 9cfe4b27-1e56-48b4-b7a8-d46851c91a44
status: experimental
description: Detects malicious behavior where the MMC utility (`mmc.exe`) executes files with reversed
  extensions caused by Right-to-Left Override (RLO) abuse, disguising them as document formats.
references:
- https://www.unicode.org/versions/Unicode5.2.0/ch02.pdf
- https://en.wikipedia.org/wiki/Right-to-left_override
- https://tria.ge/241015-l98snsyeje/behavioral2
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-02-05
tags:
- attack.execution
- attack.stealth
- attack.t1204.002
- attack.t1218.014
- attack.t1036.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
  - Image|endswith: \mmc.exe
  - OriginalFileName: MMC.exe
  selection_commandline:
    CommandLine|contains:
    - cod.msc
    - fdp.msc
    - ftr.msc
    - lmth.msc
    - slx.msc
    - tdo.msc
    - xcod.msc
    - xslx.msc
    - xtpp.msc
  condition: all of selection_*
falsepositives:
- Legitimate administrative actions using MMC to execute misnamed `.msc` files.
- Unconventional but non-malicious usage of RLO or reversed extensions.
level: high
x-soc-id: C-953
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: malware
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 9cfe4b27-1e56-48b4-b7a8-d46851c91a44
x-soc-version: 1
