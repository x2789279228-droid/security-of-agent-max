logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: whoami.exe
  - Image|endswith: \whoami.exe
  selection_user:
    User|contains:
    - AUTHORI
    - AUTORI
    - TrustedInstaller
  condition: all of selection_*
