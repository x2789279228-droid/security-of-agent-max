title: Docker Container Discovery Via Dockerenv Listing
id: 11701de9-d5a5-44aa-8238-84252f131895
status: test
description: Detects listing or file reading of ".dockerenv" which can be a sing of potential container
  discovery
references:
- https://blog.skyplabs.net/posts/container-detection/
- https://stackoverflow.com/questions/20010199/how-to-determine-if-a-process-runs-inside-lxc-docker
tags:
- attack.discovery
- attack.t1082
author: Seth Hanford
date: 2023-08-23
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
    - /cat
    - /dir
    - /find
    - /ls
    - /stat
    - /test
    - grep
    CommandLine|endswith: .dockerenv
  condition: selection
falsepositives:
- Legitimate system administrator usage of these commands
- Some container tools or deployments may use these techniques natively to determine how they proceed
  with execution, and will need to be filtered
level: low
x-soc-id: C-1715
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: low
x-soc-attack_type: info_disclosure
x-soc-severity: low
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 11701de9-d5a5-44aa-8238-84252f131895
x-soc-version: 1
