title: Disable Security Events Logging Adding Reg Key MiniNt
id: 919f2ef0-be2d-4a7a-b635-eb2b41fde044
status: test
description: Detects the addition of a key 'MiniNt' to the registry. Upon a reboot, Windows Event Log
  service will stop writing events.
references:
- https://twitter.com/0gtweet/status/1182516740955226112
- https://www.hackingarticles.in/defense-evasion-windows-event-logging-t1562-002/
author: Ilyas Ochkov, oscd.community
date: 2019-10-25
modified: 2021-11-27
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1685.001
- attack.t1112
- car.2022-03-001
logsource:
  category: registry_event
  product: windows
detection:
  selection:
  - TargetObject: HKLM\SYSTEM\CurrentControlSet\Control\MiniNt
    EventType: CreateKey
  - NewName: HKLM\SYSTEM\CurrentControlSet\Control\MiniNt
  condition: selection
falsepositives:
- Unknown
level: high
x-soc-id: C-1608
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: malware
x-soc-severity: high
