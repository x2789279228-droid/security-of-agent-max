title: Bitsadmin to Uncommon TLD
id: 9eb68894-7476-4cd6-8752-23b51f5883a7
status: test
description: Detects Bitsadmin connections to domains with uncommon TLDs
references:
- https://twitter.com/jhencinski/status/1102695118455349248
- https://isc.sans.edu/forums/diary/Investigating+Microsoft+BITS+Activity/23281/
author: Florian Roth (Nextron Systems), Tim Shelton
date: 2019-03-07
modified: 2026-09-30
tags:
- attack.command-and-control
- attack.execution
- attack.stealth
- attack.t1071.001
- attack.persistence
- attack.t1197
- attack.s0190
logsource:
  category: proxy
detection:
  selection:
    c-useragent|startswith: Microsoft BITS/
  filter_main_legit_tlds:
    cs-host|endswith:
    - .com
    - .microsoft
    - .net
    - .org
    - .scdn.co
    - .sfx.ms
  condition: selection and not 1 of filter_main_*
falsepositives:
- Rare programs that use Bitsadmin and update from regional TLDs e.g. .uk or .ca
level: high
x-soc-id: C-114
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: c2_communication
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 9eb68894-7476-4cd6-8752-23b51f5883a7
x-soc-version: 1
