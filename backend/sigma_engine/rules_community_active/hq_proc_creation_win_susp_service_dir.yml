title: Suspicious Service Binary Directory
id: 883faa95-175a-4e22-8181-e5761aeb373c
status: test
description: Detects a service binary running in a suspicious directory
references:
- https://blog.truesec.com/2021/03/07/exchange-zero-day-proxylogon-and-hafnium/
author: Florian Roth (Nextron Systems)
date: 2021-03-09
modified: 2022-10-09
tags:
- attack.stealth
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
    - \Users\Public\
    - \$Recycle.bin
    - \Users\All Users\
    - \Users\Default\
    - \Users\Contacts\
    - \Users\Searches\
    - C:\Perflogs\
    - \config\systemprofile\
    - \Windows\Fonts\
    - \Windows\IME\
    - \Windows\addins\
    ParentImage|endswith:
    - \services.exe
    - \svchost.exe
  condition: selection
falsepositives:
- Unknown
level: high
x-soc-id: C-1447
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: network_anomaly
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 883faa95-175a-4e22-8181-e5761aeb373c
x-soc-version: 1
