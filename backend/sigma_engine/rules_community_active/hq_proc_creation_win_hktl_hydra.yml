logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - '-u '
    - '-p '
    CommandLine|contains:
    - ^USER^
    - ^PASS^
  condition: selection
falsepositives:
- Software that uses the caret encased keywords PASS and USER in its command line
