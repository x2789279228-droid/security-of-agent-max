title: Perl Inline Command Execution
id: f426547a-e0f7-441a-b63e-854ac5bdf54d
status: test
description: Detects execution of perl using the "-e"/"-E" flags. This is could be used as a way to launch
  a reverse shell or execute live perl code.
references:
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
- https://www.revshells.com/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \perl.exe
  - OriginalFileName: perl.exe
  selection_cli:
    CommandLine|contains: ' -e'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
x-soc-id: C-1047
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: medium
x-soc-attack_type: malware
x-soc-severity: medium
x-soc-source: SigmaHQ
x-soc-sigmahq-id: f426547a-e0f7-441a-b63e-854ac5bdf54d
x-soc-version: 1
