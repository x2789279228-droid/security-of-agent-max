title: Suspicious Serv-U Process Pattern
id: 58f4ea09-0fc2-4520-ba18-b85c540b0eaf
status: test
description: Detects a suspicious process pattern which could be a sign of an exploited Serv-U service
references:
- https://www.microsoft.com/security/blog/2021/07/13/microsoft-discovers-threat-actor-targeting-solarwinds-serv-u-software-with-0-day-exploit/
author: Florian Roth (Nextron Systems)
date: 2021-07-14
modified: 2022-07-14
tags:
- attack.credential-access
- attack.t1555
- cve.2021-35211
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: \Serv-U.exe
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \wscript.exe
    - \cscript.exe
    - \sh.exe
    - \bash.exe
    - \schtasks.exe
    - \regsvr32.exe
    - \wmic.exe
    - \mshta.exe
    - \rundll32.exe
    - \msiexec.exe
    - \forfiles.exe
    - \scriptrunner.exe
  condition: selection
falsepositives:
- Legitimate uses in which users or programs use the SSH service of Serv-U for remote command execution
level: high
x-soc-id: C-1354
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: brute_force
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 58f4ea09-0fc2-4520-ba18-b85c540b0eaf
x-soc-version: 1
