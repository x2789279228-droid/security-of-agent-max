title: Potential Perl Reverse Shell Execution
id: 259df6bc-003f-4306-9f54-4ff1a08fa38e
status: test
description: Detects execution of the perl binary with the "-e" flag and common strings related to potential
  reverse shell activity
references:
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
- https://www.revshells.com/
author: '@d4ns4n_, Nasreddine Bencherchali (Nextron Systems)'
date: 2023-04-07
tags:
- attack.execution
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: /perl
    CommandLine|contains: ' -e '
  selection_content:
  - CommandLine|contains|all:
    - fdopen(
    - ::Socket::INET
  - CommandLine|contains|all:
    - Socket
    - connect
    - open
    - exec
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
x-soc-id: C-1692
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: malware
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 259df6bc-003f-4306-9f54-4ff1a08fa38e
x-soc-version: 1
