title: Renamed VsCode Code Tunnel Execution - File Indicator
id: d102b8f5-61dc-4e68-bd83-9a3187c67377
status: test
description: 'Detects the creation of a file with the name "code_tunnel.json" which indicate execution
  and usage of VsCode tunneling utility by an "Image" or "Process" other than VsCode.

  '
references:
- https://ipfyx.fr/post/visual-studio-code-tunnel/
- https://badoption.eu/blog/2023/01/31/code_c2.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-10-25
tags:
- attack.command-and-control
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: \code_tunnel.json
  filter_main_legit_name:
    Image|endswith:
    - \code-tunnel.exe
    - \code.exe
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
x-soc-id: C-591
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: c2_communication
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: d102b8f5-61dc-4e68-bd83-9a3187c67377
x-soc-version: 1
