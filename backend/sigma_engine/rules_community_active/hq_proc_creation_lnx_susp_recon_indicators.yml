title: Linux Recon Indicators
id: 0cf7a157-8879-41a2-8f55-388dd23746b7
status: test
description: Detects events with patterns found in commands used for reconnaissance on linux systems
references:
- https://github.com/sleventyeleven/linuxprivchecker/blob/0d701080bbf92efd464e97d71a70f97c6f2cd658/linuxprivchecker.py
author: Florian Roth (Nextron Systems)
date: 2022-06-20
tags:
- attack.reconnaissance
- attack.t1592.004
- attack.credential-access
- attack.t1552.001
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
    - ' -name .htpasswd'
    - ' -perm -4000 '
  condition: selection
falsepositives:
- Legitimate administration activities
level: high
x-soc-id: C-1727
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: brute_force
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 0cf7a157-8879-41a2-8f55-388dd23746b7
x-soc-version: 1
