title: Suspicious Java Children Processes
id: d292e0af-9a18-420c-9525-ec0ac3936892
status: test
description: Detects java process spawning suspicious children
references:
- https://www.tecmint.com/different-types-of-linux-shells/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-03
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    ParentImage|endswith: /java
    CommandLine|contains:
    - /bin/sh
    - bash
    - dash
    - ksh
    - zsh
    - csh
    - fish
    - curl
    - wget
    - python
  condition: selection
falsepositives:
- Unknown
level: high
x-soc-id: C-1723
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: malware
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: d292e0af-9a18-420c-9525-ec0ac3936892
x-soc-version: 1
