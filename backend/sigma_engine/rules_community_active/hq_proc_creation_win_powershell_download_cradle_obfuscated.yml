title: Obfuscated PowerShell OneLiner Execution
id: 44e24481-6202-4c62-9127-5a0ae8e3fe3d
status: test
description: Detects the execution of a specific OneLiner to download and execute powershell modules in
  memory.
references:
- https://thedfirreport.com/2022/05/09/seo-poisoning-a-gootloader-story/
- https://gist.github.com/mgeeky/3b11169ab77a7de354f4111aa2f0df38
author: '@Kostastsale, TheDFIRReport'
date: 2022-05-09
modified: 2025-04-16
tags:
- attack.execution
- attack.defense-impairment
- attack.t1059.001
- attack.t1685
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \powershell.exe
    CommandLine|contains|all:
    - http://127.0.0.1
    - '%{(IRM $_)}'
    - Invoke
  condition: selection
falsepositives:
- Unknown
level: high
x-soc-id: C-1090
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: malware
x-soc-severity: high
