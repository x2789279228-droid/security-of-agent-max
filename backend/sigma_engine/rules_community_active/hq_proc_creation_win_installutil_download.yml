title: File Download Via InstallUtil.EXE
id: 75edd216-1939-4c73-8d61-7f3a0d85b5cc
status: test
description: 'Detects use of .NET InstallUtil.exe in order to download arbitrary files. The files will
  be written to "%LOCALAPPDATA%\Microsoft\Windows\INetCache\IE\"

  '
references:
- https://github.com/LOLBAS-Project/LOLBAS/pull/239
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-19
modified: 2023-11-09
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \InstallUtil.exe
  - OriginalFileName: InstallUtil.exe
  selection_cli:
    CommandLine|contains:
    - ftp://
    - http://
    - https://
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
x-soc-id: C-889
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: medium
x-soc-attack_type: network_anomaly
x-soc-severity: medium
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 75edd216-1939-4c73-8d61-7f3a0d85b5cc
x-soc-version: 1
