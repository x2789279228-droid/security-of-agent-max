title: Mstsc.EXE Execution From Uncommon Parent
id: ff3b6b39-e765-42f9-bb2c-ea6761e0e0f6
status: test
description: Detects potential RDP connection via Mstsc using a local ".rdp" file located in suspicious
  locations.
references:
- https://www.blackhillsinfosec.com/rogue-rdp-revisiting-initial-access-methods/
- https://web.archive.org/web/20230726144748/https://blog.thickmints.dev/mintsights/detecting-rogue-rdp/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-04-18
tags:
- attack.lateral-movement
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - \brave.exe
    - \CCleanerBrowser.exe
    - \chrome.exe
    - \chromium.exe
    - \firefox.exe
    - \iexplore.exe
    - \microsoftedge.exe
    - \msedge.exe
    - \opera.exe
    - \vivaldi.exe
    - \whale.exe
    - \outlook.exe
  selection_img:
  - Image|endswith: \mstsc.exe
  - OriginalFileName: mstsc.exe
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
x-soc-id: C-986
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: lateral_movement
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: ff3b6b39-e765-42f9-bb2c-ea6761e0e0f6
x-soc-version: 1
