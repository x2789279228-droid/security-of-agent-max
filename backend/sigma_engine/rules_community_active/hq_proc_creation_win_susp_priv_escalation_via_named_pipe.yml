detection:
  selection_name:
  - Image|endswith:
    - \cmd.exe
    - \powershell.exe
  - OriginalFileName:
    - Cmd.Exe
    - PowerShell.EXE
  selection_args:
    CommandLine|contains|all:
    - echo
    - '>'
    - \\\\.\\pipe\\
  condition: all of selection*
falsepositives:
