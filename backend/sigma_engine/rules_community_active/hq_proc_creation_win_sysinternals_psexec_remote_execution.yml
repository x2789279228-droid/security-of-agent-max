title: Potential PsExec Remote Execution
id: ea011323-7045-460b-b2d7-0f7442ea6b38
status: test
description: Detects potential psexec command that initiate execution on a remote systems via common commandline
  flags used by the utility
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
- https://www.poweradmin.com/paexec/
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-28
modified: 2025-09-01
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - accepteula
    - ' -u '
    - ' -p '
    - ' \\\\'
  filter_main_localhost:
    CommandLine|contains:
    - \\\\localhost
    - \\\\127.
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
x-soc-id: C-1475
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: network_anomaly
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: ea011323-7045-460b-b2d7-0f7442ea6b38
x-soc-version: 1
