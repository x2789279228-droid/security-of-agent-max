title: Winrs Local Command Execution
id: bcfece3d-56fe-4545-9931-3b8e92927db1
status: experimental
description: 'Detects the execution of Winrs.exe where it is used to execute commands locally.

  Commands executed this way are launched under Winrshost.exe and can represent proxy execution used for
  defense evasion or lateral movement.

  '
references:
- https://cardinalops.com/blog/living-off-winrm-abusing-complexity-in-remote-management/
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/winrs
author: Liran Ravich, Nasreddine Bencherchali
date: 2025-10-22
tags:
- attack.lateral-movement
- attack.stealth
- attack.t1021.006
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \winrs.exe
  - OriginalFileName: winrs.exe
  selection_local_ip:
    CommandLine|contains|windash:
    - /r:localhost
    - /r:127.0.0.1
    - /r:[::1]
    - /remote:localhost
    - /remote:127.0.0.1
    - /remote:[::1]
  filter_main_remote:
    CommandLine|contains|windash:
    - '/r:'
    - '/remote:'
  condition: all of selection_* or (selection_img and not 1 of filter_main_*)
falsepositives:
- Unlikely
level: high
x-soc-id: C-1557
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: lateral_movement
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: bcfece3d-56fe-4545-9931-3b8e92927db1
x-soc-version: 1
