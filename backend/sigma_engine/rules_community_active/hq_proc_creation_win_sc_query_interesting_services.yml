title: Interesting Service Enumeration Via Sc.EXE
id: e83e8899-c9b2-483b-b355-5decc942b959
status: test
description: 'Detects the enumeration and query of interesting and in some cases sensitive services on
  the system via "sc.exe".

  Attackers often try to enumerate the services currently running on a system in order to find different
  attack vectors.

  '
references:
- https://www.n00py.io/2021/05/dumping-plaintext-rdp-credentials-from-svchost-exe/
- https://pentestlab.blog/tag/svchost/
author: Swachchhanda Shrawan Poudel
date: 2024-02-12
tags:
- attack.t1003
- attack.credential-access
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: \sc.exe
  - OriginalFileName: sc.exe
  selection_cli:
    CommandLine|contains: query
  selection_cmd:
    CommandLine|contains: termservice
  condition: all of selection_*
falsepositives:
- Unknown
level: low
x-soc-id: C-1320
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: low
x-soc-attack_type: brute_force
x-soc-severity: low
x-soc-source: SigmaHQ
x-soc-sigmahq-id: e83e8899-c9b2-483b-b355-5decc942b959
x-soc-version: 1
