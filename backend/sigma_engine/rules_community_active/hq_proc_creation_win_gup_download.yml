title: File Download Using Notepad++ GUP Utility
id: 44143844-0631-49ab-97a0-96387d6b2d7c
status: test
description: Detects execution of the Notepad++ updater (gup) from a process other than Notepad++ to download
  files.
references:
- https://twitter.com/nas_bench/status/1535322182863179776
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-10
modified: 2023-03-02
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \GUP.exe
  - OriginalFileName: gup.exe
  selection_cli:
    CommandLine|contains|all:
    - ' -unzipTo '
    - http
  filter:
    ParentImage|endswith: \notepad++.exe
  condition: all of selection* and not filter
falsepositives:
- Other parent processes other than notepad++ using GUP that are not currently identified
level: high
x-soc-id: C-791
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: c2_communication
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 44143844-0631-49ab-97a0-96387d6b2d7c
x-soc-version: 1
