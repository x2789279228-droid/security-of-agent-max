title: Created Files by Microsoft Sync Center
id: 409f8a98-4496-4aaa-818a-c931c0a8b832
status: test
description: This rule detects suspicious files created by Microsoft Sync Center (mobsync)
references:
- https://redcanary.com/blog/intelligence-insights-november-2021/
author: elhoim
date: 2022-04-28
modified: 2022-06-02
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1055
- attack.t1218
- attack.execution
logsource:
  product: windows
  category: file_event
detection:
  selection_mobsync:
    Image|endswith: \mobsync.exe
  filter_created_file:
    TargetFilename|endswith:
    - .dll
    - .exe
  condition: selection_mobsync and filter_created_file
falsepositives:
- Unknown
level: medium
x-soc-id: C-538
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: medium
x-soc-attack_type: privilege_escalation
x-soc-severity: medium
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 409f8a98-4496-4aaa-818a-c931c0a8b832
x-soc-version: 1
