title: Arbitrary File Download Via MSOHTMED.EXE
id: 459f2f98-397b-4a4a-9f47-6a5ec2f1c69d
status: test
description: Detects usage of "MSOHTMED" to download arbitrary files
references:
- https://github.com/LOLBAS-Project/LOLBAS/pull/238/files
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-19
modified: 2023-11-09
tags:
- attack.execution
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \MSOHTMED.exe
  - OriginalFileName: MsoHtmEd.exe
  selection_cli:
    CommandLine|contains:
    - ftp://
    - http://
    - https://
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
x-soc-id: C-977
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: medium
x-soc-attack_type: malware
x-soc-severity: medium
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 459f2f98-397b-4a4a-9f47-6a5ec2f1c69d
x-soc-version: 1
