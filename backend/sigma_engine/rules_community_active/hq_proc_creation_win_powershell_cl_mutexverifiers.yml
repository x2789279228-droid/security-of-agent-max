title: Potential Script Proxy Execution Via CL_Mutexverifiers.ps1
id: 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d
status: test
description: Detects the use of the Microsoft signed script "CL_mutexverifiers" to proxy the execution
  of additional PowerShell script commands
references:
- https://lolbas-project.github.io/lolbas/Scripts/CL_mutexverifiers/
author: Nasreddine Bencherchali (Nextron Systems), oscd.community, Natalia Shornikova, frack113
date: 2022-05-21
modified: 2023-08-17
tags:
- attack.stealth
- attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection_pwsh:
    ParentImage|endswith:
    - \powershell.exe
    - \pwsh.exe
    Image|endswith: \powershell.exe
    CommandLine|contains: ' -nologo -windowstyle minimized -file '
  selection_temp:
    CommandLine|contains:
    - \AppData\Local\Temp\
    - \Windows\Temp\
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
x-soc-id: C-1073
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: medium
x-soc-attack_type: network_anomaly
x-soc-severity: medium
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d
x-soc-version: 1
