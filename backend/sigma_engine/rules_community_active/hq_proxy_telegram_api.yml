title: Telegram API Access
id: b494b165-6634-483d-8c47-2026a6c52372
status: test
description: Detects suspicious requests to Telegram API without the usual Telegram User-Agent
references:
- https://researchcenter.paloaltonetworks.com/2018/03/unit42-telerat-another-android-trojan-leveraging-telegrams-bot-api-to-target-iranian-users/
- https://blog.malwarebytes.com/threat-analysis/2016/11/telecrypt-the-ransomware-abusing-telegram-api-defeated/
- https://www.welivesecurity.com/2016/12/13/rise-telebots-analyzing-disruptive-killdisk-attacks/
author: Florian Roth (Nextron Systems)
date: 2018-06-05
modified: 2023-05-18
tags:
- attack.command-and-control
- attack.t1071.001
- attack.t1102.002
logsource:
  category: proxy
detection:
  selection:
    cs-host: api.telegram.org
  filter:
    c-useragent|contains:
    - Telegram
    - Bot
  condition: selection and not filter
falsepositives:
- Legitimate use of Telegram bots in the company
level: medium
x-soc-id: C-110
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: medium
x-soc-attack_type: c2_communication
x-soc-severity: medium
x-soc-source: SigmaHQ
