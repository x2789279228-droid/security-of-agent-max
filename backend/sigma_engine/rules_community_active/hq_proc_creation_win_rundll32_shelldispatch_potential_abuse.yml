title: Potential ShellDispatch.DLL Functionality Abuse
id: 82343930-652f-43f5-ab70-2ee9fdd6d5e9
status: test
description: Detects potential "ShellDispatch.dll" functionality abuse to execute arbitrary binaries via
  "ShellExecute"
references:
- https://www.hexacorn.com/blog/2023/06/07/this-lolbin-doesnt-exist/
author: X__Junior (Nextron Systems)
date: 2023-06-20
tags:
- attack.execution
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \rundll32.exe
  - OriginalFileName: RUNDLL32.EXE
  selection_cli:
    CommandLine|contains: RunDll_ShellExecuteW
  condition: all of selection_*
falsepositives:
- Unlikely
level: medium
x-soc-id: C-1305
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: medium
x-soc-attack_type: malware
x-soc-severity: medium
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 82343930-652f-43f5-ab70-2ee9fdd6d5e9
x-soc-version: 1
