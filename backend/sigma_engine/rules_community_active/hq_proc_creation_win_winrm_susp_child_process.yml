title: Suspicious Processes Spawned by WinRM
id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
status: test
description: Detects suspicious processes including shells spawnd from WinRM host process
author: Andreas Hunkeler (@Karneades), Markus Neis
references:
- Internal Research
date: 2021-05-20
modified: 2022-07-14
tags:
- attack.t1190
- attack.initial-access
- attack.persistence
- attack.privilege-escalation
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: \wsmprovhost.exe
    Image|endswith:
    - \cmd.exe
    - \sh.exe
    - \bash.exe
    - \powershell.exe
    - \pwsh.exe
    - \wsl.exe
    - \schtasks.exe
    - \certutil.exe
    - \whoami.exe
    - \bitsadmin.exe
  condition: selection
falsepositives:
- Legitimate WinRM usage
level: high
x-soc-id: C-1556
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: web_attack
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
x-soc-version: 1
