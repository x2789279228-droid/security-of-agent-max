title: Suspicious Powercfg Execution To Change Lock Screen Timeout
id: f8d6a15e-4bc8-4c27-8e5d-2b10f0b73e5b
status: test
description: Detects suspicious execution of 'Powercfg.exe' to change lock screen timeout
references:
- https://blogs.vmware.com/security/2022/11/batloader-the-evasive-downloader-malware.html
- https://learn.microsoft.com/en-us/windows-hardware/design/device-experiences/powercfg-command-line-options
author: frack113
date: 2022-11-18
tags:
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  selection_power:
  - Image|endswith: \powercfg.exe
  - OriginalFileName: PowerCfg.exe
  selection_standby:
  - CommandLine|contains|all:
    - '/setacvalueindex '
    - SCHEME_CURRENT
    - SUB_VIDEO
    - VIDEOCONLOCK
  - CommandLine|contains|all:
    - '-change '
    - -standby-timeout-
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
x-soc-id: C-1051
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: medium
x-soc-attack_type: network_anomaly
x-soc-severity: medium
x-soc-source: SigmaHQ
x-soc-sigmahq-id: f8d6a15e-4bc8-4c27-8e5d-2b10f0b73e5b
x-soc-version: 1
