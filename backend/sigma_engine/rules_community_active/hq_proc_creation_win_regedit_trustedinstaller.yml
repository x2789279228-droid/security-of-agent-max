title: Regedit as Trusted Installer
id: 883835a7-df45-43e4-bf1d-4268768afda4
status: test
description: Detects a regedit started with TrustedInstaller privileges or by ProcessHacker.exe
references:
- https://twitter.com/1kwpeter/status/1397816101455765504
author: Florian Roth (Nextron Systems)
date: 2021-05-27
modified: 2022-10-09
tags:
- attack.privilege-escalation
- attack.t1548
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \regedit.exe
    ParentImage|endswith:
    - \TrustedInstaller.exe
    - \ProcessHacker.exe
  condition: selection
falsepositives:
- Unlikely
level: high
x-soc-id: C-1239
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: privilege_escalation
x-soc-severity: high
