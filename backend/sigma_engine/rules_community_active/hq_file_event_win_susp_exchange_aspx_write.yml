title: Suspicious MSExchangeMailboxReplication ASPX Write
id: 7280c9f3-a5af-45d0-916a-bc01cb4151c9
status: test
description: Detects suspicious activity in which the MSExchangeMailboxReplication process writes .asp
  and .apsx files to disk, which could be a sign of ProxyShell exploitation
references:
- https://redcanary.com/blog/blackbyte-ransomware/
author: Florian Roth (Nextron Systems)
date: 2022-02-25
tags:
- attack.initial-access
- attack.t1190
- attack.persistence
- attack.t1505.003
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith: \MSExchangeMailboxReplication.exe
    TargetFilename|endswith:
    - .aspx
    - .asp
  condition: selection
falsepositives:
- Unknown
level: high
x-soc-id: C-543
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: web_attack
