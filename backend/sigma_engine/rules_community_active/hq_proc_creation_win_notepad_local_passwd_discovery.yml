title: Notepad Password Files Discovery
id: 3b4e950b-a3ea-44d3-877e-432071990709
status: experimental
description: Detects the execution of Notepad to open a file that has the string "password" which may
  indicate unauthorized access to credentials or suspicious activity.
references:
- https://thedfirreport.com/2025/02/24/confluence-exploit-leads-to-lockbit-ransomware/
- https://intel.thedfirreport.com/eventReports/view/57
author: The DFIR Report
tags:
- attack.discovery
- attack.t1083
date: 2025-02-21
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith: \explorer.exe
    Image|endswith: \notepad.exe
    CommandLine|endswith:
    - password*.txt
    - password*.csv
    - password*.doc
    - password*.xls
  condition: selection
falsepositives:
- Legitimate use of opening files from remote hosts by administrators or users. However, storing passwords
  in text readable format could potentially be a violation of the organization's policy. Any match should
  be investigated further.
level: low
x-soc-id: C-1020
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: low
x-soc-attack_type: info_disclosure
x-soc-severity: low
x-soc-source: SigmaHQ
x-soc-sigmahq-id: 3b4e950b-a3ea-44d3-877e-432071990709
x-soc-version: 1
