title: Setuid and Setgid
id: c21c4eaa-ba2e-419a-92b2-8371703cbe21
status: test
description: Detects suspicious change of file privileges with chown and chmod commands
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1548.001/T1548.001.md
author: Ömer Günal
date: 2020-06-16
modified: 2022-10-05
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1548.001
logsource:
  product: linux
  category: process_creation
detection:
  selection_root:
    CommandLine|contains: chown root
  selection_perm:
    CommandLine|contains:
    - ' chmod u+s'
    - ' chmod g+s'
  condition: all of selection_*
falsepositives:
- Legitimate administration activities
level: low
x-soc-id: C-1710
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: low
x-soc-attack_type: malware
x-soc-severity: low
