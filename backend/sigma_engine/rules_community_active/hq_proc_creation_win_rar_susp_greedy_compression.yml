title: Suspicious Greedy Compression Using Rar.EXE
id: afe52666-401e-4a02-b4ff-5d128990b8cb
status: test
description: Detects RAR usage that creates an archive from a suspicious folder, either a system folder
  or one of the folders often used by attackers for staging purposes
references:
- https://decoded.avast.io/martinchlumecky/png-steganography
author: X__Junior (Nextron Systems), Florian Roth (Nextron Systems)
date: 2022-12-15
modified: 2024-01-02
tags:
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection_opt_1:
  - Image|endswith: \rar.exe
  - Description: Command line RAR
  selection_opt_2:
    CommandLine|contains:
    - '.exe a '
    - ' a -m'
  selection_cli_flags:
    CommandLine|contains|all:
    - ' -hp'
    - ' -r '
  selection_cli_folders:
    CommandLine|contains:
    - ' ?:\\\*.'
    - ' ?:\\\\\*.'
    - ' ?:\$Recycle.bin\'
    - ' ?:\PerfLogs\'
    - ' ?:\Temp'
    - ' ?:\Users\Public\'
    - ' ?:\Windows\'
    - ' %public%'
  condition: 1 of selection_opt_* and all of selection_cli_*
falsepositives:
- Unknown
level: high
x-soc-id: C-1197
x-soc-shadow: true
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: malware
x-soc-severity: high
x-soc-source: SigmaHQ
x-soc-sigmahq-id: afe52666-401e-4a02-b4ff-5d128990b8cb
x-soc-version: 1
