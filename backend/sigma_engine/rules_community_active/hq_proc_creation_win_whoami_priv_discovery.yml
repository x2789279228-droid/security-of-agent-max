title: Security Privileges Enumeration Via Whoami.EXE
id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
status: test
description: Detects a whoami.exe executed with the /priv command line flag instructing
  the tool to show all current user privileges. This is often used after a privilege
  escalation attempt.
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/whoami
author: Florian Roth (Nextron Systems)
date: 2021-05-05
modified: 2023-02-28
tags:
- attack.privilege-escalation
- attack.discovery
- attack.t1033
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \whoami.exe
  - OriginalFileName: whoami.exe
  selection_cli:
    CommandLine|contains:
    - ' /priv'
    - ' -priv'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_whoami_priv_discovery/info.yml
x-soc-id: C-1545
x-soc-shadow: false
x-soc-action: alert
x-soc-confidence: high
x-soc-attack_type: privilege_escalation
x-soc-severity: high
