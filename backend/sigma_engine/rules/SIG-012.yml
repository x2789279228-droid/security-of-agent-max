title: SSH 认证失败聚合检测（原始 auth.log）
id: aaaaaaaa-0012-0000-0000-000000000012
status: test
description: >
  匹配 rsyslog 转发的原始 sshd 认证失败文本（"Failed password"）,
  按源 IP 聚合, 5 分钟内超过 5 次判定为 SSH 暴力破解。
  与上游适配器的 BRUTE_FORCE 预分类相互独立 —— 本规则直接对原始
  message 文本求值, 作为"检测器不复述上游分类"的证据链锚点
  （对应 eval_datasets 的 evidence_kind=raw_indicator 叙事）。
date: 2026/10/25
author: SOC Platform
license: SOC-Internal
logsource:
  category: system
  product: linux
detection:
  selection:
    message|contains:
    - Failed password
    - Invalid user
  condition: selection
level: high
tags:
- attack.credential-access.t1110
falsepositives:
- 用户输错密码的孤立失败（由 src_ip 聚合阈值过滤）
x-soc-id: SIG-012
x-soc-confidence: high
x-soc-action: block_ip
x-soc-attack_type: brute_force
x-soc-severity: high
x-soc-aggregation:
  func: count
  field: src_ip
  op: '>'
  threshold: 5
  timeframe: 5m
x-soc-version: 1
