title: 敏感配置文件探测（.env / .git）
id: aaaaaaaa-0018-0000-0000-000000000018
status: test
description: >
  URL 直接探测 .env / .git 目录 / 数据库凭据文件 —— 拿源码与密钥的
  高频自动化攻击原始指标(比通用"信息探测"更具体, 可直接归因)。
date: 2026/10/25
author: SOC Platform
license: SOC-Internal
logsource:
  category: webserver
  product: generic
detection:
  selection:
    url|contains:
    - '/.env'
    - '/.git/config'
    - '/.git/HEAD'
    - '/.svn/entries'
    - '/database.yml'
    - '/wp-config.php.bak'
  condition: selection
level: high
tags:
- attack.credential-access.t1552
falsepositives:
- 极少; CI/扫描器白名单可按 src_ip 加成机制处理
x-soc-id: SIG-018
x-soc-confidence: high
x-soc-action: block_ip
x-soc-attack_type: info_disclosure
x-soc-severity: high
x-soc-version: 1
