title: SSH 暴力破解
id: aaaaaaaa-0001-0000-0000-000000000007
status: test
description: 检测对 SSH 服务的异常连接
date: 2026/08/24
author: SOC Platform
license: SOC-Internal
logsource:
  category: auth
  product: linux
detection:
  sel_port:
    dst_port: 22
  sel_event:
    event|contains:
      - BRUTE_FORCE
      - SSH_BRUTE
      - LOGIN_FAIL
      - 登录失败
      - 暴力破解
      - 爆破
  # v5 修复:必须同时满足 SSH 端口 AND 登录失败特征。
  # 此前 "1 of sel_*"(OR) 仅凭 dst_port=22 就命中, 正常 SSH 登录被误判为
  # 暴力破解并经 FastPath 强信号路径误封禁良性用户 (2026-09-01 复现)。
  condition: sel_port and sel_event
level: high
tags:
  - attack.credential-access.t1110.001
falsepositives:
  - dev ssh admin bursts
x-soc-id: SIG-007
x-soc-confidence: medium
x-soc-action: block_ip
x-soc-attack_type: brute_force
x-soc-severity: high
# 阈值语义 (2026-10-24 对齐实际行为): 本规则声明 x-soc-aggregation,
# 单事件命中只产生 pending 候选(pending-only 不抬分、不进封禁, 见 P0-2),
# **第 2 条** 命中(op '>', threshold 1, 5m 窗口)才由 Flink SIGMA_AGGREGATE
# 告警携带 block_ip 处置。若业务确需"单条结论立即处置", 应拆出独立的
# 结论型规则(不带 x-soc-aggregation)—— 单事件处置走 FastPath 的
# critical/强信号门槛, 而不是靠聚合规则降阈值。
x-soc-aggregation:
  func: count
  field: src_ip
  op: ">"
  threshold: 1
  timeframe: 5m
