# 守望核心运营告警。队列丢弃、DLQ 积压、关闭未完成任务、
# 承诺不丢类别的非预期丢弃必须立刻可见。
groups:
  - name: soc-core
    interval: 15s
    rules:
      - alert: SocEventBusDrop
        expr: increase(soc_eventbus_drops_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: SSE 队列发生丢弃
          description: 近 5 分钟丢弃 {{ $value }} 条。critical 车道的丢弃视为非预期丢失。

      - alert: SocEventBusCriticalDrop
        expr: increase(soc_unexpected_drops_total{kind="eventbus_critical"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: 承诺不丢的 SSE 事件被丢弃
          description: critical 车道无法入队且无法按事件 ID 补查。

      - alert: SocDlqBacklog
        expr: soc_dlq_depth > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: DLQ 出现积压
          description: 当前待处理死信 {{ $value }} 条。

      - alert: SocDlqOldestWait
        expr: soc_dlq_oldest_wait_seconds > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: DLQ 最老消息等待超过 5 分钟
          description: 最老死信已等待 {{ $value }} 秒。

      - alert: SocShutdownLeftoverTasks
        expr: soc_lifecycle_leftover_tasks > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: 关闭时仍有未完成任务
          description: 组件遗留任务 {{ $value }}。spilled 应可恢复；lost 是非预期丢失。

      - alert: SocUnexpectedDrop
        expr: increase(soc_unexpected_drops_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: 承诺不丢的事件发生非预期丢弃
          description: 近 5 分钟非预期丢弃 {{ $value }}。

      - alert: SocKafkaConsumerLag
        expr: soc_kafka_consumer_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Kafka 消费跟不上
          description: topic={{ $labels.topic }} lag={{ $value }}

      - alert: SocKafkaOldestLag
        expr: soc_kafka_oldest_lag_seconds > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Kafka 最老积压消息超过 2 分钟
          description: topic={{ $labels.topic }} age={{ $value }}s

      - alert: SocKafkaConsumerDead
        expr: soc_kafka_consumer_alive == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Kafka 消费循环已停止
          description: loop={{ $labels.loop }} 未存活超过 1 分钟。

      - alert: SocAuditPqLost
        expr: increase(soc_audit_pq_lost_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: 审计优先级队列任务丢失
          description: payload 先于 ZSET 成员过期，任务不可恢复；reason={{ $labels.reason }}

      - alert: SocKafkaConsumerRestarts
        expr: increase(soc_kafka_consumer_restarts_total[10m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Kafka 消费循环反复重启
          description: loop={{ $labels.loop }} 近 10 分钟重启 {{ $value }} 次。

# ── 生产化演练告警: Kafka 集群健康 + Flink 流处理 SLO ──
# kafka_* 指标来自 kafka_exporter (full profile); lite profile 下这些告警不评估。
  - name: soc-kafka-cluster
    interval: 15s
    rules:
      - alert: KafkaBrokerDown
        expr: kafka_brokers < 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Kafka 集群 broker 数不足 3
          description: 当前存活 broker={{ $value }}。full profile 下任一 broker 宕机即触发; 演练杀 broker 时预期亮起, 重启后恢复。

      - alert: KafkaUnderReplicatedPartitions
        expr: sum(kafka_topic_partition_under_replicated_partition) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Kafka 出现 under-replicated 分区
          description: 共 {{ $value }} 个分区副本不足 (RF=3/minISR=2 语义下的降级信号)。

      - alert: KafkaTopicBelowMinIsr
        expr: min by (topic) (kafka_topic_partition_in_sync_replica) < 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "topic ISR 跌破 minISR=2"
          description: "topic={{ $labels.topic }} —— 写入可用性即将丧失 (acks=all + minISR=2 会拒绝写入)。"

      - alert: KafkaConsumerLagHigh
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 5000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "消费组积压超 5000 条"
          description: "group={{ $labels.consumergroup }} topic={{ $labels.topic }} lag={{ $value }} —— 消费能力不足或下游故障。"

  - name: soc-flink-stream
    interval: 15s
    rules:
      - alert: FlinkCheckpointFailed
        expr: increase(flink_jobmanager_job_numberOfFailedCheckpoints[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Flink checkpoint 连续失败
          description: EXACTLY_ONCE 依赖 checkpoint; 失败 = 作业失去故障恢复点。

      - alert: FlinkJobsNotAllRunning
        # MetricNames.NUM_RUNNING_JOBS (flink-runtime 1.20 源码核实; numJobsRunning 只是 REST 字段名)
        expr: flink_jobmanager_numRunningJobs < 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Flink 核心作业不足 3 个
          description: "当前运行 {{ $value }} 个作业 (期望 3: LogValidation / AnomalyDetection / SigmaThresholdAggregation)。"

      - alert: FlinkDuplicateRateHigh
        expr: >
          sum(increase(flink_taskmanager_job_task_data_quality_events_duplicate[15m]))
          / clamp_min(sum(increase(flink_taskmanager_job_task_data_quality_events_total[15m])), 1) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 60s 窗口去重命中占比过高
          description: 近 15 分钟重复事件占比 {{ $value | humanizePercentage }} —— 上游在重复发送或去重窗口异常。
