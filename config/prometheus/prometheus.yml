# ── Prometheus 配置 ──
# 抓取 Flink (9250/9251) + Python (/metrics), 开启 exemplar 供 trace↔metric 关联
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    source: soc

rule_files:
  - /etc/prometheus/alerts.yml

# J 清零(2026-10-30): 告警路由到 Alertmanager(9093)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: soc-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: soc-flink-jobmanager
    metrics_path: /metrics
    static_configs:
      - targets: ["flink-jobmanager:9250"]

  - job_name: soc-flink-taskmanager
    metrics_path: /metrics
    static_configs:
      # 3 副本 TaskManager, 指标端口均为容器内 9250 (prometheus reporter)
      - targets: ["flink-taskmanager-1:9250", "flink-taskmanager-2:9250", "flink-taskmanager-3:9250"]

  # ── Kafka 集群 (full profile): broker 存活/ISR/under-replicated/消费组 lag ──
  # kafka-exporter 属 full profile; lite 下 target 不可达仅影响 kafka_* 指标
  - job_name: soc-kafka
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka-exporter:9308"]
