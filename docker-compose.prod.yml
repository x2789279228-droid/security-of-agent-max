# ════════════════════════════════════════════
# 生产环境覆盖 (docker-compose.yml 基础上叠加)
#   用法(先拉取预构建镜像, 再启动):
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   必填: IMAGE_TAG 必须指定已发布到 GHCR 的具体标签(如 main / sha-xxxxxx / 1.2.3)
#     IMAGE_TAG=1.2.3 docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   说明: 生产不构建源码、不暴露宿主机调试端口, 全部服务使用预构建镜像。
# ════════════════════════════════════════════
services:
  # ── 自建应用服务: 强制使用 GHCR 预构建镜像 ──
  flink-jobmanager:
    image: ghcr.io/x2789279228-droid/soc-flink:${IMAGE_TAG:?IMAGE_TAG 必填 (如 main/sha-xxxxxx/1.2.3)}
    environment:
      # 生产 fail-closed: 数据源白名单必须显式配置 (源码/compose 不再内置演示密钥)
      VALID_API_KEYS: "${VALID_API_KEYS:?VALID_API_KEYS 必填, 逗号分隔的数据源 API Key}"

  # 3 副本 TaskManager (与 base compose 的 flink-taskmanager-1/2/3 对齐)
  flink-taskmanager-1:
    image: ghcr.io/x2789279228-droid/soc-flink:${IMAGE_TAG:?IMAGE_TAG 必填 (如 main/sha-xxxxxx/1.2.3)}

  flink-taskmanager-2:
    image: ghcr.io/x2789279228-droid/soc-flink:${IMAGE_TAG:?IMAGE_TAG 必填 (如 main/sha-xxxxxx/1.2.3)}

  flink-taskmanager-3:
    image: ghcr.io/x2789279228-droid/soc-flink:${IMAGE_TAG:?IMAGE_TAG 必填 (如 main/sha-xxxxxx/1.2.3)}

  flink-job-submitter:
    image: ghcr.io/x2789279228-droid/soc-flink:${IMAGE_TAG:?IMAGE_TAG 必填 (如 main/sha-xxxxxx/1.2.3)}

  backend:
    image: ghcr.io/x2789279228-droid/soc-backend:${IMAGE_TAG:?IMAGE_TAG 必填 (如 main/sha-xxxxxx/1.2.3)}
    ports:
      - "8001:8000"
    environment:
      # 生产强制 Kafka 模式 (Flink 唯一流处理事实源):
      # 关闭 HTTP 直连双路径, 避免 Python 侧重复校验/去重/异常评分
      SHARED_MEMORY_KAFKA_ENABLED: "true"
      # 响应执行默认 dry_run；真实执行必须显式覆盖该变量（失败关闭）
      SHARED_MEMORY_EXECUTION_MODE: "${SHARED_MEMORY_EXECUTION_MODE:-dry_run}"
      SHARED_MEMORY_ENV_NAME: "prod"
      # ── 生产 fail-closed 必填项 (2026-10-23 第一阶段止血) ──
      # 数据源密钥: 源码/默认值已不再内置, 生产必须显式配置
      SHARED_MEMORY_SOURCE_API_KEYS: "${SHARED_MEMORY_SOURCE_API_KEYS:?SOURCE_API_KEYS 必填, JSON 格式 api_key 到源名映射, 与 VALID_API_KEYS 一致}"
      # 审批 HMAC 独立密钥: prod 拒绝回退 jwt_secret (security_crypto fail-closed)
      SHARED_MEMORY_CONTROL_HMAC_KEY: "${SHARED_MEMORY_CONTROL_HMAC_KEY:?CONTROL_HMAC_KEY 必填, 且与 JWT_SECRET 取不同值}"
      # 启动自动迁移 (fail-closed: 失败阻止启动, 不允许未迁移 schema 进流量)
      SHARED_MEMORY_AUTO_MIGRATE: "true"
      # 生产 JSON 结构化日志
      SHARED_MEMORY_LOG_FORMAT: "json"

  frontend:
    image: ghcr.io/x2789279228-droid/soc-frontend:${IMAGE_TAG:?IMAGE_TAG 必填 (如 main/sha-xxxxxx/1.2.3)}
    ports:
      - "3001:80"
      - "3002:8080"

  # ── 基础设施: 生产关闭宿主机调试端口, 仅保留对外必需端口 ──
  postgres:
    ports: []

  redis:
    ports: []

  # 2026-10-24: full profile 下 Kafka 集群为 kafka-1/2/3 —— 覆盖必须指向 kafka-1,
  # 否则 prod overlay 静默不生效, 调试端口仍暴露。
  kafka-1:
    ports:
      # 生产仅保留 EXTERNAL SASL_SSL 9094 (外部日志源, advertised=KAFKA_PUBLIC_HOST);
      # 关闭本机 PLAINTEXT 调试端口 9095
      - "9094:9094"

  schema-registry:
    ports: []

  kafka-ui:
    ports:
      # P1: kafka-ui 默认无认证, 不能绑 0.0.0.0 暴露集群管理面 —
      # 仅本机回环(需远程时走 SSH 隧道)。
      - "127.0.0.1:18082:8080"